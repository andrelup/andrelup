<svg xmlns="http://www.w3.org/2000/svg" width="846" height="388" viewBox="0 0 846 388" role="img" aria-labelledby="t" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">Spec-Driven Development en dos niveles. Nivel de proyecto, una vez: Constitution, principios, estándares y límites para todo el proyecto. Nivel de especificación, por cada funcionalidad o bug, en seis fases: 1 Specify, qué y por qué, con criterios de aceptación; 2 Clarify, resolver ambigüedades y casos límite; 3 Plan, arquitectura, flujos y restricciones; 4 Tasks, unidades listas para implementar; 5 Implement, código y tests con agentes de IA; 6 Validate, verificar el resultado contra la especificación</title>
